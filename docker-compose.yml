version: '3.8'

services:
  mongodb:
    image: mongo:7
    container_name: autoapply_mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: autoapply_pro

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: autoapply_server
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongodb:27017/autoapply_pro
      - PORT=5000
    env_file:
      - .env
    depends_on:
      - mongodb
    volumes:
      - ./server:/app
      - /app/node_modules

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        - VITE_GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
        - VITE_GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID}
    container_name: autoapply_client
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - server

volumes:
  mongo_data:
